<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bounce 01 | Profile Photo Switcher</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <section class="profile-switcher">

            <h1>Profile Photo Switcher</h1>

            <p>
                Click the button to switch between profile photos.
            </p>

            <img
                id="profile-photo"
                src="assets/photo-1.png"
                alt="Professional profile photo"
            >

            <button
                id="switch-photo"
                type="button"
            >
                Switch Photo
            </button>

        </section>
    </main>

    <script src="script.js"></script>

</body>

</html>
