<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bounce 02 | Language Switcher</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <section class="language-switcher">

            <header>
                <p id="eyebrow">BOUNCE 02</p>

                <h1 id="title">
                    Language Switcher
                </h1>

                <p id="description">
                    Switch this page between English and Arabic.
                </p>
            </header>

            <div class="content-card">

                <h2 id="welcome">
                    Welcome to my portfolio
                </h2>

                <p id="text">
                    This page demonstrates dynamic language switching
                    using JavaScript and the DOM.
                </p>

                <button
                    id="language-toggle"
                    type="button"
                >
                    العربية
                </button>

            </div>

        </section>
    </main>

    <script src="script.js"></script>

</body>

</html>
